<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#16213E;--muted:#6B7690;--line:#DDE3EE;--bot:#fff;--user:#16213E;--userText:#fff;--accent:#F2A33A;--teal:#0E7C7B}
:root[data-theme="dark"]{--bg:#0E1424;--panel:#161E33;--ink:#EAEEF8;--muted:#8E9AB8;--line:#26304B;--bot:#1D2740;--user:#F2A33A;--userText:#1A1204}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--panel);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:20px}
:root[data-theme="dark"] .logo{background:var(--accent);color:#1A1204}
header h1{font-size:17px;font-weight:800}
header p{font-size:12px;color:var(--muted)}
header p::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2DB36F;margin-right:6px}
.spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;gap:8px;max-width:88%}
.row.user{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.bubble{padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.bot .bubble{background:var(--bot);border:1px solid var(--line);border-left:4px solid var(--teal);border-top-left-radius:4px}
.user .bubble{background:var(--user);color:var(--userText);border-top-right-radius:4px}
.meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.meta button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:13px}
.meta button.on{background:var(--teal);border-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0 38px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:500;font-size:13px;font-family:inherit;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
.typing{display:flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
form{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input{flex:1;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:13px 16px;font-weight:500;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--accent)}
.send{border:0;background:var(--accent);color:#1A1204;border-radius:14px;padding:0 20px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
.send:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">S</div>
    <div><h1>Campus Saathi</h1><p>College helper, ask anything</p></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clear" title="New chat" aria-label="New chat">+</button>
    <button class="icon-btn" id="theme" title="Dark mode" aria-label="Toggle dark mode">&#9680;</button>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <form id="f">
    <input id="q" placeholder="Apna sawal likho..." autocomplete="off" maxlength="300" aria-label="Your question">
    <button class="send" id="go">Send</button>
  </form>
</div>

<script>
const $ = s => document.querySelector(s);
const msgs = $('#msgs');
let sid = localStorage.getItem('sid');
if (!sid) { sid = 's' + Date.now() + Math.random().toString(36).slice(2, 8); localStorage.setItem('sid', sid); }

// Theme
const root = document.documentElement;
root.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', root.dataset.theme); };

function scroll() { msgs.scrollTop = msgs.scrollHeight; }

function addUser(text) {
  const r = document.createElement('div');
  r.className = 'row user';
  r.innerHTML = '<div class="bubble"></div>';
  r.querySelector('.bubble').textContent = text;
  msgs.appendChild(r); scroll();
}

function addBot(text, source, chatId, fb) {
  const r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = '<div class="av">S</div><div><div class="bubble"></div><div class="meta"></div></div>';
  r.querySelector('.bubble').textContent = text;
  const meta = r.querySelector('.meta');
  const label = source === 'faq' ? 'College FAQ' : source === 'ai' ? 'AI answer' : 'Sent to admin';
  meta.innerHTML = '<span>' + label + '</span>';
  if (chatId && source !== 'none') {
    ['1', '-1'].forEach(v => {
      const b = document.createElement('button');
      b.textContent = v === '1' ? '\uD83D\uDC4D' : '\uD83D\uDC4E';
      b.setAttribute('aria-label', v === '1' ? 'Helpful' : 'Not helpful');
      if (fb === Number(v)) b.className = 'on';
      b.onclick = () => {
        fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chatId, value: Number(v) }) });
        meta.querySelectorAll('button').forEach(x => x.className = '');
        b.className = 'on';
      };
      meta.appendChild(b);
    });
  }
  msgs.appendChild(r); scroll();
}

function typing(on) {
  const old = $('#typing'); if (old) old.remove();
  if (!on) return;
  const r = document.createElement('div');
  r.className = 'row bot'; r.id = 'typing';
  r.innerHTML = '<div class="av">S</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  msgs.appendChild(r); scroll();
}

async function showWelcome() {
  addBot('Namaste! Main Campus Saathi hoon. Fees, exams, timing, hostel, ID card, kuch bhi pucho.', 'faq');
  try {
    const list = await (await fetch('/api/suggestions')).json();
    const box = document.createElement('div');
    box.className = 'chips';
    list.forEach(t => {
      const c = document.createElement('button');
      c.className = 'chip'; c.textContent = t;
      c.onclick = () => { box.remove(); send(t); };
      box.appendChild(c);
    });
    msgs.appendChild(box); scroll();
  } catch {}
}

async function loadHistory() {
  try {
    const list = await (await fetch('/api/history/' + sid)).json();
    if (!list.length) return showWelcome();
    list.forEach(c => { addUser(c.question); addBot(c.answer, c.source, c._id, c.feedback); });
  } catch { showWelcome(); }
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  addUser(text);
  $('#go').disabled = true;
  typing(true);
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, sessionId: sid }) });
    const d = await r.json();
    typing(false);
    if (d.error) addBot('Kuch gadbad ho gayi. Thodi der baad try karo.', 'none');
    else addBot(d.answer, d.source, d.chatId);
  } catch {
    typing(false);
    addBot('Server se connect nahi ho paya. Internet check karo.', 'none');
  }
  $('#go').disabled = false;
  $('#q').focus();
}

$('#f').onsubmit = e => { e.preventDefault(); const v = $('#q').value; $('#q').value = ''; send(v); };
$('#clear').onclick = () => { localStorage.setItem('sid', 's' + Date.now() + Math.random().toString(36).slice(2, 8)); location.reload(); };
loadHistory();
</script>
</body>
</html>
