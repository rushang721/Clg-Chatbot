<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Campus Saathi</title>
<style>
:root{
  --navy:#14213D;--gold:#FCA311;--bg:#F3F5FA;--card:#fff;--text:#1B2540;--muted:#6A7490;--line:#E2E6F0;
  --user:#14213D;--userText:#fff;--grid:rgba(20,33,61,.045);--shadow:0 1px 2px rgba(20,33,61,.08),0 4px 14px rgba(20,33,61,.05);--head:#14213D
}
:root[data-theme="dark"]{
  --bg:#0C1220;--card:#161F36;--text:#E7EBF7;--muted:#8C97B5;--line:#26314F;
  --user:#FCA311;--userText:#1A1204;--grid:rgba(255,255,255,.035);--shadow:none;--head:#0F1A33
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{width:100%;max-width:820px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);box-shadow:0 0 50px rgba(20,33,61,.12)}

/* ---------- Header ---------- */
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:3px solid var(--gold);z-index:3}
.crest{width:38px;height:44px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{font-size:11.5px;opacity:.75;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
.mini{width:46px;height:46px;border-radius:50%;background:#FFF3D6;border:2px solid var(--gold);overflow:hidden;flex:none;position:relative}
.online{position:absolute;right:-1px;bottom:0;width:11px;height:11px;border-radius:50%;background:#2DB36F;border:2px solid var(--head)}
.hav{position:relative;flex:none}
.hbtn{background:rgba(255,255,255,.08);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:19px;cursor:pointer;flex:none}
.hbtn:active{background:rgba(255,255,255,.2)}

/* ---------- Mascot ---------- */
.mascot{display:block;width:100%;height:100%;overflow:hidden}
.mascot [data-s]{display:none}
.mascot[data-mood="idle"] [data-s~="idle"],.mascot[data-mood="happy"] [data-s~="happy"],.mascot[data-mood="love"] [data-s~="love"],
.mascot[data-mood="thinking"] [data-s~="thinking"],.mascot[data-mood="confused"] [data-s~="confused"],
.mascot[data-mood="sad"] [data-s~="sad"],.mascot[data-mood="wave"] [data-s~="wave"]{display:inline}
.float{animation:float 3.2s ease-in-out infinite}
.mascot.still .float{animation:none}
@keyframes float{50%{transform:translateY(-4px)}}
.fig{transform-origin:100px 220px}
.mascot[data-mood="happy"] .fig,.mascot[data-mood="love"] .fig{animation:hop .5s ease-out 2}
@keyframes hop{40%{transform:translateY(-12px)}}
.mascot[data-mood="confused"] .fig{animation:tilt 1.4s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-3deg)}}
.mascot[data-mood="sad"] .fig{transform:translateY(4px)}
.arm{transform-origin:148px 180px;transform:rotate(150deg);transition:transform .35s}
.mascot[data-mood="wave"] .arm,.mascot[data-mood="happy"] .arm,.mascot[data-mood="love"] .arm{transform:rotate(0)}
.mascot[data-mood="wave"] .arm{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.eye{animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pupil{transition:transform .25s}
.mascot[data-mood="thinking"] .pupil{transform:translate(3px,-4px)}
.mascot[data-mood="confused"] .pupil{transform:translate(-3px,-1px)}
.mascot[data-mood="sad"] .pupil{transform:translate(0,3px)}
.heart{animation:beat .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes beat{to{transform:scale(1.25)}}
.td{opacity:.2;animation:pulse 1.2s infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes pulse{50%{opacity:1}}
.qmark{animation:qpop 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes qpop{to{transform:scale(1.2) rotate(8deg)}}

/* ---------- Messages ---------- */
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.pill{align-self:center;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:4px 12px;border-radius:999px;margin:8px 0}
.row{display:flex;gap:8px;max-width:88%;margin-top:6px;align-items:flex-end}
.row.out{align-self:flex-end;flex-direction:row-reverse}
.row.in{align-self:flex-start}
.av{width:34px;height:34px;border-radius:50%;background:#FFF3D6;border:2px solid var(--gold);overflow:hidden;flex:none}
.col{display:flex;flex-direction:column;min-width:0}
.out .col{align-items:flex-end}
.bubble{padding:9px 13px 7px;font-size:15px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere;min-width:70px;box-shadow:var(--shadow)}
.in .bubble{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px 14px 14px 14px}
.out .bubble{background:var(--user);color:var(--userText);border-radius:14px 4px 14px 14px}
.txt{white-space:pre-wrap}
.meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:3px;padding:0 2px}
.out .bubble .meta{color:inherit;opacity:.7;justify-content:flex-end;margin-top:2px}
.src{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.acts{display:flex;gap:6px;margin-top:5px}
.acts button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.acts button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .acts button.on{background:var(--gold);border-color:var(--gold);color:#1A1204}
.dots{display:flex;gap:4px;padding:6px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-5px);opacity:1}}

/* ---------- Welcome ---------- */
.welcome{margin:auto;text-align:center;padding:10px 6px 20px;max-width:560px;width:100%}
.stage{width:150px;height:165px;margin:0 auto 4px}
.welcome h2{font-family:Georgia,"Times New Roman",serif;font-size:23px;margin-bottom:4px}
.welcome p{color:var(--muted);font-size:14.5px;margin-bottom:18px;line-height:1.45}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;font:inherit;font-size:13.5px;text-align:left;cursor:pointer;line-height:1.35;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;min-height:58px}
.card:active{transform:scale(.98)}
.card b{font-size:20px;flex:none}
@media(max-width:380px){.cards{grid-template-columns:1fr}}

/* ---------- Input ---------- */
#fab{position:absolute;right:14px;bottom:96px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
#fab.show{opacity:1;pointer-events:auto}
.bar{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 4px}
.field{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:3px 16px;display:flex;align-items:center;min-height:48px;box-shadow:var(--shadow)}
.field:focus-within{border-color:var(--gold)}
textarea{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15.5px;line-height:1.4;resize:none;max-height:120px;padding:10px 0}
textarea::placeholder{color:var(--muted)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:#1A1204;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .1s,opacity .2s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.4;cursor:default}
.note{text-align:center;font-size:11px;color:var(--muted);padding:2px 12px calc(8px + env(safe-area-inset-bottom))}

/* ---------- Reactions + toast ---------- */
.burst{position:fixed;z-index:50;pointer-events:none;opacity:0;animation:rise 1.5s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-95px) scale(1.15) rotate(12deg)}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);border:1px solid var(--gold);max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="crest" viewBox="0 0 48 56" aria-hidden="true"><path d="M24 2 L44 9 V28 C44 40 34 50 24 54 C14 50 4 40 4 28 V9Z" fill="#14213D" stroke="#FCA311" stroke-width="3"/><path d="M13 22 Q18 19 24 22 Q30 19 35 22 V36 Q30 33 24 36 Q18 33 13 36Z" fill="#fff"/><path d="M24 22V36" stroke="#14213D" stroke-width="1.5"/></svg>
    <div class="ttl"><h1 id="college">Your College Name</h1><p>Student Help Desk</p></div>
    <div class="hav"><div class="mini" id="hm"></div><span class="online"></span></div>
    <button class="hbtn" id="clear" title="New chat" aria-label="New chat">&#43;</button>
    <button class="hbtn" id="theme" title="Dark mode" aria-label="Toggle dark mode">&#9680;</button>
  </header>

  <div id="msgs" aria-live="polite"></div>
  <button id="fab" aria-label="Scroll to latest">&#8595;</button>

  <div class="bar">
    <div class="field">
      <textarea id="q" rows="1" maxlength="300" placeholder="Apna sawal likho..." aria-label="Type your question"></textarea>
    </div>
    <button class="send" id="go" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 20.5v-6.8l9-1.7-9-1.7V3.5l19 8.5z"/></svg>
    </button>
  </div>
  <div class="note">Saathi galti kar sakta hai. Zaruri baat ke liye college office se confirm karein.</div>
</div>

<script>
/* ===== Edit this: apne college ka naam ===== */
const COLLEGE_NAME = 'Your College Name';

const $ = s => document.querySelector(s);
const msgs = $('#msgs'), input = $('#q'), sendBtn = $('#go'), fab = $('#fab');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let sid = localStorage.getItem('sid');
if (!sid) { sid = 's' + Date.now() + Math.random().toString(36).slice(2, 8); localStorage.setItem('sid', sid); }
let busy = false, lastDay = '', lastTick = null, moodTimer;

$('#college').textContent = COLLEGE_NAME;
document.title = COLLEGE_NAME + ' | Campus Saathi';

/* ===== Mascot "Saathi" (original SVG character) ===== */
const MASCOT_INNER = `<g class="float"><g class="fig">
<path d="M38 222 C38 176 68 158 100 158 C132 158 162 176 162 222Z" fill="#14213D"/>
<path d="M84 158 L100 184 L116 158Z" fill="#fff"/>
<path d="M96 176 L104 176 L107 198 L100 206 L93 198Z" fill="#FCA311"/>
<path d="M52 182 L44 214" stroke="#14213D" stroke-width="16" stroke-linecap="round"/>
<g class="arm"><path d="M148 180 L172 142" stroke="#14213D" stroke-width="16" stroke-linecap="round"/><circle cx="174" cy="136" r="10" fill="#F1C27D"/></g>
<rect x="90" y="138" width="20" height="26" rx="8" fill="#E5B06B"/>
<circle cx="55" cy="106" r="8" fill="#F1C27D"/><circle cx="145" cy="106" r="8" fill="#F1C27D"/>
<circle cx="100" cy="102" r="46" fill="#F1C27D"/>
<path d="M56 94 C56 74 78 70 100 70 C122 70 144 74 144 94 C136 84 120 80 100 80 C80 80 64 84 56 94Z" fill="#2B2118"/>
<ellipse cx="74" cy="120" rx="8" ry="5" fill="#F29C9C" opacity=".55"/>
<ellipse cx="126" cy="120" rx="8" ry="5" fill="#F29C9C" opacity=".55"/>
<g data-s="idle wave" fill="none" stroke="#2B2118" stroke-width="3.5" stroke-linecap="round"><path d="M72 91 Q82 87 92 91"/><path d="M108 91 Q118 87 128 91"/></g>
<g data-s="happy love thinking" fill="none" stroke="#2B2118" stroke-width="3.5" stroke-linecap="round"><path d="M72 86 Q82 80 92 86"/><path d="M108 86 Q118 80 128 86"/></g>
<g data-s="sad" fill="none" stroke="#2B2118" stroke-width="3.5" stroke-linecap="round"><path d="M72 93 Q82 91 92 86"/><path d="M108 86 Q118 91 128 93"/></g>
<g data-s="confused" fill="none" stroke="#2B2118" stroke-width="3.5" stroke-linecap="round"><path d="M72 85 Q82 80 92 85"/><path d="M108 88 L128 92"/></g>
<g data-s="idle wave sad confused thinking">
<g class="eye" style="transform-origin:82px 104px"><ellipse cx="82" cy="104" rx="9" ry="10.5" fill="#fff"/><g class="pupil"><circle cx="82" cy="106" r="5.5" fill="#1b1b2f"/><circle cx="84" cy="103.5" r="1.8" fill="#fff"/></g></g>
<g class="eye" style="transform-origin:118px 104px"><ellipse cx="118" cy="104" rx="9" ry="10.5" fill="#fff"/><g class="pupil"><circle cx="118" cy="106" r="5.5" fill="#1b1b2f"/><circle cx="120" cy="103.5" r="1.8" fill="#fff"/></g></g>
</g>
<g data-s="happy" fill="none" stroke="#1b1b2f" stroke-width="4" stroke-linecap="round"><path d="M73 106 Q82 95 91 106"/><path d="M109 106 Q118 95 127 106"/></g>
<g data-s="love"><g transform="translate(82 104)"><path class="heart" d="M0 -3 C-6 -11 -15 -2 0 9 C15 -2 6 -11 0 -3Z" fill="#E63946"/></g><g transform="translate(118 104)"><path class="heart" d="M0 -3 C-6 -11 -15 -2 0 9 C15 -2 6 -11 0 -3Z" fill="#E63946"/></g></g>
<path data-s="idle" d="M88 124 Q100 134 112 124" fill="none" stroke="#7a2e2e" stroke-width="3.5" stroke-linecap="round"/>
<g data-s="happy love wave"><path d="M86 120 Q100 142 114 120Z" fill="#7a2e2e"/><path d="M92 131 Q100 126 108 131 Q100 138 92 131Z" fill="#E86A6A"/></g>
<circle data-s="thinking" cx="100" cy="128" r="4" fill="#7a2e2e"/>
<path data-s="confused" d="M89 128 Q94.5 123 100 128 T111 128" fill="none" stroke="#7a2e2e" stroke-width="3.5" stroke-linecap="round"/>
<path data-s="sad" d="M89 133 Q100 123 111 133" fill="none" stroke="#7a2e2e" stroke-width="3.5" stroke-linecap="round"/>
<path d="M64 74 C64 56 136 56 136 74 L136 84 C118 76 82 76 64 84Z" fill="#14213D"/>
<path d="M30 62 L100 38 L170 62 L100 84Z" fill="#1F3466"/>
<circle cx="100" cy="61" r="4" fill="#FCA311"/>
<path d="M100 61 L168 64 L168 96" stroke="#FCA311" stroke-width="3" fill="none"/>
<circle cx="168" cy="100" r="5" fill="#FCA311"/>
<g data-s="thinking" fill="#FCA311"><circle class="td" cx="152" cy="30" r="4"/><circle class="td d2" cx="165" cy="20" r="5"/><circle class="td d3" cx="181" cy="9" r="6"/></g>
<text data-s="confused" class="qmark" x="150" y="30" font-size="34" font-weight="700" fill="#FCA311" font-family="Georgia,serif">?</text>
</g></g>`;

function mascot(mood, crop, extra) {
  return '<svg class="mascot ' + (extra || '') + '" data-mood="' + mood + '" viewBox="' + (crop ? '30 30 140 140' : '0 0 200 220') + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + MASCOT_INNER + '</svg>';
}
$('#hm').innerHTML = mascot('wave', true, 'live');
setTimeout(() => setMood('idle'), 2800);

function setMood(mood, hold) {
  document.querySelectorAll('.mascot.live').forEach(m => m.dataset.mood = mood);
  clearTimeout(moodTimer);
  if (hold) moodTimer = setTimeout(() => setMood('idle'), hold);
}

function burst(emoji, n) {
  if (reduce) return;
  const t = document.querySelector('#welcome .mascot.live') || document.querySelector('#hm .mascot.live');
  if (!t) return;
  const r = t.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'burst'; s.textContent = emoji;
    s.style.left = (r.left + r.width / 2 + (Math.random() * 90 - 45)) + 'px';
    s.style.top = (r.top + r.height / 2) + 'px';
    s.style.animationDelay = (i * 90) + 'ms';
    s.style.fontSize = (16 + Math.random() * 10) + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1800 + i * 90);
  }
}

function toast(text) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ===== helpers ===== */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const fmtTime = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function dayLabel(d) {
  const x = new Date(d), t = new Date(), y = new Date(Date.now() - 864e5);
  if (x.toDateString() === t.toDateString()) return 'Today';
  if (x.toDateString() === y.toDateString()) return 'Yesterday';
  return x.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
}
function dayPill(d) { const k = new Date(d).toDateString(); if (k === lastDay) return; lastDay = k; msgs.appendChild(el('div', 'pill', dayLabel(d))); }
function toBottom(smooth) { msgs.scrollTo({ top: msgs.scrollHeight, behavior: smooth && !reduce ? 'smooth' : 'auto' }); }
msgs.addEventListener('scroll', () => fab.classList.toggle('show', msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight > 220));
fab.onclick = () => toBottom(true);

const root = document.documentElement;
root.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', root.dataset.theme); };

/* ===== messages ===== */
function addUser(text, when, read) {
  dayPill(when);
  const row = el('div', 'row out'), col = el('div', 'col'), b = el('div', 'bubble');
  b.appendChild(el('div', 'txt', text));
  const meta = el('div', 'meta');
  meta.appendChild(el('span', '', fmtTime(when)));
  const tick = el('span', '', read ? '\u2713\u2713 seen' : '\u2713 sent');
  meta.appendChild(tick);
  b.appendChild(meta); col.appendChild(b); row.appendChild(col); msgs.appendChild(row);
  lastTick = tick; toBottom(false);
}

function typeInto(node, text, done) {
  if (reduce || text.length > 700) { node.textContent = text; done(); return; }
  let i = 0; const step = Math.max(1, Math.ceil(text.length / 80));
  const t = setInterval(() => {
    i += step; node.textContent = text.slice(0, i); toBottom(false);
    if (i >= text.length) { clearInterval(t); done(); }
  }, 18);
}

function addBot(text, source, chatId, fb, when, animate) {
  dayPill(when);
  const mood = source === 'none' ? 'confused' : 'happy';
  const row = el('div', 'row in');
  const av = el('div', 'av'); av.innerHTML = mascot(mood, true, 'still');
  const col = el('div', 'col'), b = el('div', 'bubble'), txt = el('div', 'txt');
  const meta = el('div', 'meta');
  const label = source === 'faq' ? 'College FAQ' : source === 'ai' ? 'AI answer' : source === 'local' ? 'Campus Saathi' : 'Sent to admin';
  meta.appendChild(el('span', 'src', label));
  meta.appendChild(el('span', '', fmtTime(when)));
  b.appendChild(txt); col.appendChild(b); col.appendChild(meta);
  row.appendChild(av); row.appendChild(col);

  const acts = el('div', 'acts');
  const copy = el('button', '', 'Copy');
  copy.onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1400); }).catch(() => {});
  };
  acts.appendChild(copy);
  if (chatId && source !== 'none' && source !== 'local') {
    [['\uD83D\uDC4D', 1], ['\uD83D\uDC4E', -1]].forEach(([icon, v]) => {
      const x = el('button', fb === v ? 'on' : '', icon);
      x.setAttribute('aria-label', v === 1 ? 'Helpful' : 'Not helpful');
      x.onclick = () => {
        fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chatId, value: v }) });
        acts.querySelectorAll('button').forEach(y => y.classList.remove('on'));
        x.classList.add('on');
        if (v === 1) { setMood('love', 3200); burst('\u2764\uFE0F', 7); toast('Thanks! Aapka feedback mil gaya \uD83D\uDE0A'); }
        else { setMood('sad', 3200); toast('Sorry! Main behtar karne ki koshish karunga \uD83D\uDE4F'); }
      };
      acts.appendChild(x);
    });
  }
  msgs.appendChild(row);
  const finish = () => { col.appendChild(acts); toBottom(false); };
  if (animate) typeInto(txt, text, finish); else { txt.textContent = text; finish(); }
}

function showTyping(on) {
  const old = $('#typing'); if (old) old.remove();
  if (!on) return;
  const row = el('div', 'row in'); row.id = 'typing';
  const av = el('div', 'av'); av.innerHTML = mascot('thinking', true, 'still');
  const col = el('div', 'col'), b = el('div', 'bubble');
  b.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  col.appendChild(b); row.appendChild(av); row.appendChild(col); msgs.appendChild(row); toBottom(true);
}

/* ===== welcome + history ===== */
const ICONS = [[/fee|payment|pay/i, '\uD83D\uDCB3'], [/exam|result|date/i, '\uD83D\uDCDD'], [/hostel|room/i, '\uD83C\uDFE0'], [/id card|identity/i, '\uD83E\uDEAA'], [/time|timing|hour/i, '\uD83D\uDD58'], [/library|book/i, '\uD83D\uDCDA']];
const iconFor = t => { for (const [re, ic] of ICONS) if (re.test(t)) return ic; return '\uD83C\uDF93'; };

async function showWelcome() {
  const w = el('div', 'welcome'); w.id = 'welcome';
  const stage = el('div', 'stage'); stage.innerHTML = mascot('wave', false, 'live');
  w.appendChild(stage);
  w.appendChild(el('h2', '', 'Namaste! Main Campus Saathi hoon'));
  w.appendChild(el('p', '', COLLEGE_NAME + ' ka virtual helper. Fees, exams, timing, hostel, ID card, kuch bhi pucho.'));
  const grid = el('div', 'cards');
  try {
    const list = await (await fetch('/api/suggestions')).json();
    list.slice(0, 6).forEach(t => {
      const c = el('button', 'card');
      c.appendChild(el('b', '', iconFor(t)));
      c.appendChild(el('span', '', t));
      c.onclick = () => send(t);
      grid.appendChild(c);
    });
  } catch {}
  w.appendChild(grid); msgs.appendChild(w);
  setMood('wave', 3000);
}

async function loadHistory() {
  try {
    const list = await (await fetch('/api/history/' + sid)).json();
    if (!Array.isArray(list) || !list.length) return showWelcome();
    list.forEach(c => { addUser(c.question, c.createdAt, true); addBot(c.answer, c.source, c._id, c.feedback, c.createdAt, false); });
    toBottom(false);
  } catch { showWelcome(); }
}

/* ===== small talk (server ko bheje bina reaction) ===== */
const SMALLTALK = [
  { re: /^\s*(hi+|hello+|hey+|hlo+|namaste|namaskar|good\s*(morning|afternoon|evening)|gm)\b/i, reply: 'Namaste! \uD83D\uDC4B Main Campus Saathi hoon. Fees, exams, timing, hostel ya ID card, kuch bhi pucho.', mood: 'wave', fx: '\uD83D\uDC4B' },
  { re: /\b(thank|thanks|thx|shukriya|dhanyavad|dhanyawad)\b/i, reply: 'Aapka swagat hai! \uD83D\uDE0A Aur kuch puchna ho to bolo.', mood: 'love', fx: '\u2764\uFE0F' },
  { re: /\b(bye|goodbye|alvida|tata)\b/i, reply: 'Bye! \uD83D\uDC4B Padhai achhi chale. Zarurat ho to wapas aana.', mood: 'wave', fx: '\uD83D\uDC4B' },
  { re: /(who are you|tum kaun|aap kaun|tera naam|tumhara naam|aapka naam|your name)/i, reply: 'Main Campus Saathi hoon, aapke college ka virtual helper. College ke baare me kuch bhi pucho.', mood: 'happy', fx: '\u2728' }
];

/* ===== send ===== */
function updateBtn() { sendBtn.disabled = busy || !input.value.trim(); }
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }

async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;
  busy = true;
  const w = $('#welcome'); if (w) w.remove();
  addUser(text, new Date(), false);
  input.value = ''; autosize(); updateBtn();
  setMood('thinking'); showTyping(true);

  const talk = text.length <= 40 && SMALLTALK.find(t => t.re.test(text));
  try {
    if (talk) {
      await sleep(700);
      showTyping(false); if (lastTick) lastTick.textContent = '\u2713\u2713 seen';
      addBot(talk.reply, 'local', null, 0, new Date(), true);
      setMood(talk.mood, 3200); burst(talk.fx, 5);
    } else {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, sessionId: sid }) });
      const d = await r.json();
      showTyping(false); if (lastTick) lastTick.textContent = '\u2713\u2713 seen';
      if (d.error) { addBot('Kuch gadbad ho gayi. Thodi der baad try karo.', 'none', null, 0, new Date(), true); setMood('sad', 3200); }
      else {
        addBot(d.answer, d.source, d.chatId, 0, new Date(), true);
        if (d.source === 'none') { setMood('confused', 3500); burst('\u2753', 3); }
        else { setMood('happy', 3000); burst('\u2728', 5); }
      }
    }
  } catch {
    showTyping(false);
    addBot('Server se connect nahi ho paya. Internet check karo ya thodi der baad try karo.', 'none', null, 0, new Date(), true);
    setMood('sad', 3200);
  }
  busy = false; updateBtn();
  if (finePointer) input.focus();
}

input.addEventListener('input', () => { autosize(); updateBtn(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && finePointer) { e.preventDefault(); send(input.value); } });
sendBtn.onclick = () => send(input.value);
$('#clear').onclick = () => { localStorage.setItem('sid', 's' + Date.now() + Math.random().toString(36).slice(2, 8)); location.reload(); };

loadHistory();
</script>
</body>
</html>
